name: GitHub Metrics

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:
push:
branches:
- main
- master

jobs:
github-metrics:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:

  # ─────────────────────────────────────────────
  # 📅 Isometric contribution calendar
  # ─────────────────────────────────────────────

  - name: 📅 Contribution Calendar
    uses: lowlighter/metrics@latest
    with:
      filename: metrics-isocalendar.svg
      token: ${{ secrets.METRICS_TOKEN }}

      user: CodewithTanzeel
      base: ""

      plugin_isocalendar: yes
      plugin_isocalendar_duration: full-year

      output_action: commit

      config_timezone: Asia/Karachi


  # ─────────────────────────────────────────────
  # 🎩 Open-source contributions
  # ─────────────────────────────────────────────

  - name: 🎩 Open Source Contributions
    uses: lowlighter/metrics@latest
    with:
      filename: metrics-notable.svg
      token: ${{ secrets.METRICS_TOKEN }}

      user: CodewithTanzeel
      base: ""

      plugin_notable: yes

      # Show PRs, issues and commits
      plugin_notable_types: commit,pull_request,issue

      # Include contributions to both
      # organizations and individual developers
      plugin_notable_from: all

      # Show repository names
      plugin_notable_repositories: yes

      output_action: commit

      config_timezone: Asia/Karachi
```
